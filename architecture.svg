<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" font-family="Helvetica Neue, Helvetica, Roboto, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F8980A"/>
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FED040"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8E8C86"/>
    </marker>
  </defs>

  <rect width="1240" height="760" fill="#0C0C0C"/>

  <!-- ── header ───────────────────────────────────────────────────────────── -->
  <text x="40" y="46" fill="#D8D6D0" font-size="19" letter-spacing="3.4">ORAH CONTROL</text>
  <text x="40" y="68" fill="#8E8C86" font-size="12" letter-spacing="1.1">Live 360° production · up to 24 Orah 4i cameras · signal path</text>
  <line x1="40" y1="86" x2="1200" y2="86" stroke="#333331" stroke-width="1"/>

  <!-- ── column headers ───────────────────────────────────────────────────── -->
  <text x="40"  y="118" fill="#F8980A" font-size="11" letter-spacing="2.4">CAMERAS</text>
  <text x="340" y="118" fill="#F8980A" font-size="11" letter-spacing="2.4">RECORDING NODES</text>
  <text x="640" y="118" fill="#F8980A" font-size="11" letter-spacing="2.4">MAC · ORAH CONTROL</text>
  <text x="940" y="118" fill="#F8980A" font-size="11" letter-spacing="2.4">STITCHING</text>

  <!-- ── 1 · cameras ──────────────────────────────────────────────────────── -->
  <rect x="40" y="132" width="260" height="196" rx="6" fill="#161615" stroke="#333331"/>
  <text x="58" y="158" fill="#D8D6D0" font-size="14">Orah 4i × 1…24</text>
  <line x1="58" y1="170" x2="282" y2="170" stroke="#333331"/>
  <text x="58" y="192" fill="#8E8C86" font-size="11.5">4 sensors · 2 SoCs · 2 IP addresses</text>
  <text x="58" y="212" fill="#8E8C86" font-size="11.5">4 × RTMP out, one per lens</text>
  <text x="58" y="232" fill="#D8D6D0" font-size="11.5">1920×1440 @30 · H.264 · ~15 Mbps</text>
  <text x="58" y="252" fill="#8E8C86" font-size="11.5">streams 0_0 · 0_1 · 1_0 · 1_1</text>
  <text x="58" y="278" fill="#8E8C86" font-size="11.5">AmbiX ambisonic audio</text>
  <text x="58" y="298" fill="#8E8C86" font-size="11.5">announced over Bonjour</text>
  <text x="58" y="318" fill="#5E5C57" font-size="10.5">_vscamera._tcp</text>

  <!-- 1 → 2 -->
  <line x1="304" y1="230" x2="334" y2="230" stroke="#F8980A" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="292" y="216" fill="#5E5C57" font-size="9.5" letter-spacing="0.8">RTMP</text>

  <!-- ── 2 · nodes ────────────────────────────────────────────────────────── -->
  <rect x="340" y="132" width="260" height="196" rx="6" fill="#161615" stroke="#333331"/>
  <text x="358" y="158" fill="#D8D6D0" font-size="14">Linux node · 4 cameras each</text>
  <line x1="358" y1="170" x2="582" y2="170" stroke="#333331"/>
  <text x="358" y="192" fill="#8E8C86" font-size="11.5">MediaMTX ingest :1935</text>
  <text x="358" y="212" fill="#D8D6D0" font-size="11.5">records fMP4 straight to SSD</text>
  <text x="358" y="232" fill="#8E8C86" font-size="11.5">no transcode · ~0 % CPU</text>
  <text x="358" y="252" fill="#8E8C86" font-size="11.5">25-min segments ≈ 2.8 GB</text>
  <text x="358" y="272" fill="#8E8C86" font-size="11.5">mergerfs pool · rolls to next disk</text>
  <text x="358" y="292" fill="#8E8C86" font-size="11.5">480p proxy for the desk</text>
  <text x="358" y="318" fill="#5E5C57" font-size="10.5">status :8000 · _orahnode._tcp</text>

  <!-- 2 → 3 -->
  <line x1="604" y1="230" x2="634" y2="230" stroke="#F8980A" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="592" y="216" fill="#5E5C57" font-size="9.5" letter-spacing="0.8">PROXY</text>

  <!-- ── 3 · mac ──────────────────────────────────────────────────────────── -->
  <rect x="640" y="132" width="260" height="196" rx="6" fill="#161615" stroke="#F8980A" stroke-width="1.4"/>
  <text x="658" y="158" fill="#D8D6D0" font-size="14">Orah Control.app</text>
  <line x1="658" y1="170" x2="882" y2="170" stroke="#333331"/>
  <text x="658" y="192" fill="#8E8C86" font-size="11.5">discovery · control · tally · delay</text>
  <text x="658" y="212" fill="#D8D6D0" font-size="11.5">desk: 2 × hardware decode only</text>
  <text x="658" y="232" fill="#8E8C86" font-size="11.5">Metal dissolve · 0.65 ms / frame</text>
  <text x="658" y="252" fill="#8E8C86" font-size="11.5">4 × hardware encode · CFR</text>
  <text x="658" y="272" fill="#8E8C86" font-size="11.5">multiview from node proxies</text>
  <text x="658" y="292" fill="#8E8C86" font-size="11.5">ambisonic send / return</text>
  <text x="658" y="318" fill="#5E5C57" font-size="10.5">SwiftUI · VideoToolbox · Metal</text>

  <!-- 3 → 4 -->
  <line x1="904" y1="230" x2="934" y2="230" stroke="#F8980A" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="890" y="216" fill="#5E5C57" font-size="9.5" letter-spacing="0.8">4 × RTMP</text>

  <!-- ── 4 · stitching ────────────────────────────────────────────────────── -->
  <rect x="940" y="132" width="260" height="196" rx="6" fill="#161615" stroke="#333331"/>
  <text x="958" y="158" fill="#D8D6D0" font-size="14">Vahana VR</text>
  <line x1="958" y1="170" x2="1182" y2="170" stroke="#333331"/>
  <text x="958" y="192" fill="#8E8C86" font-size="11.5">stitchEm · the Orah 4i original</text>
  <text x="958" y="212" fill="#8E8C86" font-size="11.5">takes the same 4 streams</text>
  <text x="958" y="232" fill="#8E8C86" font-size="11.5">the camera itself sends</text>
  <text x="958" y="258" fill="#D8D6D0" font-size="11.5">always an RTMP client —</text>
  <text x="958" y="276" fill="#D8D6D0" font-size="11.5">a server sits in between</text>
  <text x="958" y="302" fill="#8E8C86" font-size="11.5">stitched live 360° output</text>

  <!-- ── control plane ────────────────────────────────────────────────────── -->
  <rect x="40" y="366" width="1160" height="92" rx="6" fill="#161615" stroke="#333331"/>
  <text x="58" y="392" fill="#FED040" font-size="11" letter-spacing="2.2">CONTROL PLANE</text>
  <text x="58" y="416" fill="#8E8C86" font-size="11.5">WebSocket on port 9989, subprotocol camctrl-protobuf/1.0 — the protocol the factory tool uses, implemented 1:1.</text>
  <text x="58" y="436" fill="#8E8C86" font-size="11.5">Start and stop streaming, audio gain, camera clock. One connection is opened per camera and held open for the whole show.</text>
  <path d="M 760 366 L 760 348 L 170 348 L 170 332" fill="none" stroke="#FED040" stroke-width="1.5" marker-end="url(#ay)"/>
  <text x="430" y="342" fill="#FED040" font-size="9.5" letter-spacing="1.4">CONTROL · 9989</text>

  <!-- ── audio ────────────────────────────────────────────────────────────── -->
  <rect x="40" y="478" width="568" height="112" rx="6" fill="#161615" stroke="#333331"/>
  <text x="58" y="504" fill="#FED040" font-size="11" letter-spacing="2.2">AUDIO</text>
  <text x="58" y="528" fill="#8E8C86" font-size="11.5">AmbiX ambisonic — ACN channel order (W, Y, Z, X), SN3D</text>
  <text x="58" y="548" fill="#8E8C86" font-size="11.5">normalisation. Sound follows programme through the same</text>
  <text x="58" y="568" fill="#8E8C86" font-size="11.5">dissolve. CoreAudio send and return for outboard processing.</text>

  <!-- ── recording independence ───────────────────────────────────────────── -->
  <rect x="632" y="478" width="568" height="112" rx="6" fill="#161615" stroke="#D81030" stroke-width="1.2"/>
  <text x="650" y="504" fill="#D81030" font-size="11" letter-spacing="2.2">RECORDING IS INDEPENDENT</text>
  <text x="650" y="528" fill="#8E8C86" font-size="11.5">The nodes record whether or not the desk is running. Closing</text>
  <text x="650" y="548" fill="#8E8C86" font-size="11.5">the app, switching cameras, or losing the Mac entirely does not</text>
  <text x="650" y="568" fill="#8E8C86" font-size="11.5">interrupt a take. Nothing on the recording path is transcoded.</text>

  <!-- ── scale ────────────────────────────────────────────────────────────── -->
  <line x1="40" y1="620" x2="1200" y2="620" stroke="#333331"/>
  <text x="40" y="648" fill="#5E5C57" font-size="10.5" letter-spacing="2.2">SCALE</text>
  <text x="40" y="674" fill="#8E8C86" font-size="11.5">24 cameras · 96 streams · 6 nodes. A node runs on hardware as modest as a dual-core Celeron because it never touches the pixels.</text>
  <text x="40" y="696" fill="#8E8C86" font-size="11.5">Only the two cameras on the desk are decoded on the Mac; the rest cost nothing but their proxy thumbnails.</text>
  <text x="40" y="726" fill="#5E5C57" font-size="10.5">Grey is idle · amber is the media path · yellow is control · red is recording and on-air.</text>
</svg>
