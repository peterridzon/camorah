<svg width="900" viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" role="img" style="background:#0d1117;border-radius:12px">
<title>Orah Control System — Architecture</title>

<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#d29922" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#484f58" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ── TITLE ─────────────────────────────────────────────────────── -->
<text x="450" y="36" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" font-weight="700" fill="#e6edf3">Orah Control System</text>
<text x="450" y="56" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#8b949e">22× Orah 4i · Mac M4 · 4× Intel nodes · Vahana VR</text>

